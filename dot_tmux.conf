unbind r
bind r source-file ~/.tmux.conf

set -g prefix C-s
set -sg escape-time 10

# Number tmux windows/tabs from 1 instead of 0.
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g mouse on

# Prefix-free copy-mode/scroll bindings.
# Avoid binding M-[ globally: Yazi emits escape sequences that tmux can
# interpret as this key, dropping tmux into copy/search mode on startup.
bind-key -n M-v copy-mode
bind-key -n M-u copy-mode \; send-keys -X halfpage-up
bind-key -n M-d copy-mode \; send-keys -X halfpage-down

# Use tmux's own terminfo inside panes, and let capable outer terminals
# (Ghostty included) expose modern features through tmux.
set -g default-terminal "tmux-256color"
set -g extended-keys on
# Use set -g rather than set -as so re-sourcing this file does not append duplicates.
set -g terminal-features 'xterm*:clipboard:ccolour:cstyle:focus:title,screen*:title,rxvt*:ignorefkeys,xterm*:extkeys,ghostty*:extkeys'
# Do not let TUIs send raw terminal probes through tmux; Ghostty replies can
# leak back as pasted text in panes.
set -g allow-passthrough off

# Ghostty-style navigation bindings that work without the tmux prefix.
# Tabs/windows
bind-key -n C-. next-window
bind-key -n C-, previous-window
bind-key -n S-C-t new-window
bind-key -n C-Tab next-window
bind-key -n C-S-Tab previous-window
bind-key -n C-PPage previous-window
bind-key -n C-NPage next-window
bind-key -n C-S-Left previous-window
bind-key -n C-S-Right next-window
bind-key -n M-1 select-window -t :=1
bind-key -n M-2 select-window -t :=2
bind-key -n M-3 select-window -t :=3
bind-key -n M-4 select-window -t :=4
bind-key -n M-5 select-window -t :=5
bind-key -n M-6 select-window -t :=6
bind-key -n M-7 select-window -t :=7
bind-key -n M-8 select-window -t :=8
bind-key -n M-9 select-window -t :=9
bind-key -n C-w kill-pane

# New panes/splits
# Start new panes and windows from the active pane's directory. This keeps
# tabs/splits inside the same project workspace without affecting other tmux
# sessions.
bind-key c new-window -c '#{pane_current_path}'
bind-key '"' split-window -v -c '#{pane_current_path}'
bind-key % split-window -h -c '#{pane_current_path}'
bind-key -n S-C-t new-window -c '#{pane_current_path}'
bind-key -n M-+ split-window -h -c '#{pane_current_path}'
bind-key -n M-- split-window -v -c '#{pane_current_path}'
bind-key -n M-_ split-window -v -c '#{pane_current_path}'

# Navigate panes
bind-key -n M-z resize-pane -Z
bind-key -n M-Right select-pane -R
bind-key -n M-Left select-pane -L
bind-key -n M-Down select-pane -D
bind-key -n M-Up select-pane -U
bind-key -n M-h select-pane -L
bind-key -n M-j select-pane -D
bind-key -n M-k select-pane -U
bind-key -n M-l select-pane -R

# Resize panes
bind-key -n M-S-Right resize-pane -R 25
bind-key -n M-S-Left resize-pane -L 25
bind-key -n M-S-Up resize-pane -U 25
bind-key -n M-S-Down resize-pane -D 25

# act like vim
setw -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# List of plugins
set -g @plugin 'tmux-plugins/tpm'


set -g @plugin 'christoomey/vim-tmux-navigator'

set -g @plugin 'dracula/tmux'

set -g @dracula-show-powerline true
set -g @dracula-show-flags true
set -g @dracula-show-left-icon session
set -g @dracula-plugins "battery network custom:tailnet.sh time"
set -g @dracula-custom-plugin-colors "green dark_gray"
set -g @dracula-military-time true
set -g status-position top

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
